<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar cita - Consultorio Salud Centro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <header class="bg-primary text-white text-center py-4">
        <h1>Consultorio Salud Centro</h1>
        <p class="mb-0">Solicitud de cita médica</p>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="h4 mb-4">Datos del paciente</h2>

                        <form id="formCita" novalidate>
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre completo</label>
                                <input type="text" id="nombre" class="form-control" required>
                                <div id="errorNombre" class="text-danger small"></div>
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input type="email" id="correo" class="form-control" required>
                                <div id="errorCorreo" class="text-danger small"></div>
                            </div>

                            <div class="mb-3">
                                <label for="fecha" class="form-label">Fecha de la cita</label>
                                <input type="date" id="fecha" class="form-control" required>
                                <div id="errorFecha" class="text-danger small"></div>
                            </div>

                            <div class="mb-3">
                                <label for="especialidad" class="form-label">Especialidad</label>
                                <select id="especialidad" class="form-select" required>
                                    <option value="">Seleccione una especialidad</option>
                                    <option value="Consulta general">Consulta general</option>
                                    <option value="Odontología">Odontología</option>
                                    <option value="Nutrición">Nutrición</option>
                                </select>
                                <div id="errorEspecialidad" class="text-danger small"></div>
                            </div>

                            <div class="mb-3">
                                <label for="horario" class="form-label">Horario disponible</label>
                                <select id="horario" class="form-select" required>
                                    <option value="">Seleccione un horario</option>
                                </select>
                                <div id="errorHorario" class="text-danger small"></div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                Solicitar cita
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/cita.js"></script>
</body>
</html>
