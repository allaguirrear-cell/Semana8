<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen del pedido | Trigal de Lima</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #fffaf3;
        }

        .navbar, .encabezado {
            background-color: #70452d;
        }

        .encabezado {
            color: white;
        }

        .titulo-seccion {
            color: #70452d;
        }

        .btn-trigal {
            background-color: #70452d;
            color: white;
        }

        .btn-trigal:hover {
            background-color: #54331f;
            color: white;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">🥖 Trigal de Lima</span>
        </div>
    </nav>

    <header class="encabezado text-center py-4">
        <div class="container">
            <h1 class="h2 fw-bold">Resumen del presupuesto</h1>
            <p class="mb-0">Detalle de los productos seleccionados</p>
        </div>
    </header>

    <main class="container py-4">
        <div class="card shadow-sm">
            <div class="card-body p-3 p-md-4" id="contenidoPedido">
                <!-- El resumen se genera desde JavaScript -->
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="pedido.html" class="btn btn-trigal btn-lg">
                Volver al cotizador
            </a>
        </div>

        <p class="text-center text-muted small mt-3">
            Este presupuesto es referencial. No procesa pagos ni registra pedidos reales.
        </p>
    </main>

    <script src="js/resumen.js"></script>
</body>
</html>
